name: Windows installer

# Установщик Windows собирается только на Windows: jpackage не умеет кросс-сборку.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Токен API не лежит в репозитории: файл создаётся из секрета KITCONN_API_TOKEN
      - name: Create Secrets.kt
        shell: bash
        env:
          KITCONN_API_TOKEN: ${{ secrets.KITCONN_API_TOKEN }}
        run: |
          test -n "$KITCONN_API_TOKEN" || { echo "Секрет KITCONN_API_TOKEN не задан"; exit 1; }
          printf 'package com.kitconn.desktop\n\nobject Secrets {\n    const val API_TOKEN = "%s"\n}\n' "$KITCONN_API_TOKEN" \
            > desktopApp/src/main/kotlin/com/kitconn/desktop/Secrets.kt

      - name: Fetch Xray core
        shell: bash
        run: desktopApp/scripts/fetch-xray.sh windows

      - name: Build MSI
        shell: bash
        run: ./gradlew :desktopApp:packageMsi --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KitConn-Windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
